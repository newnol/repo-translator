name: Translate retain-pdf (zh→en comments)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # weekly Sunday midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest

    services:
      libre-1:
        image: libretranslate/libretranslate:latest
        ports:
          - 5000:5000
      libre-2:
        image: libretranslate/libretranslate:latest
        ports:
          - 5001:5000

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo-translator

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache translation state
        uses: actions/cache@v4
        with:
          path: retain-pdf-en/.repo-translator-state.json
          key: translate-retain-pdf-${{ github.run_id }}
          restore-keys: translate-retain-pdf-

      - name: Install repo-translator
        run: |
          cd repo-translator
          pip install -e .

      - name: Wait for LibreTranslate
        run: |
          for port in 5000 5001; do
            echo "Waiting for LibreTranslate on :$port..."
            for i in $(seq 30); do
              if curl -sf http://localhost:$port/languages >/dev/null 2>&1; then
                echo "LibreTranslate on :$port ready"
                break
              fi
              echo "Attempt $i: not ready yet, sleeping 10s..."
              sleep 10
            done
          done

      - name: Clone retain-pdf
        run: git clone https://github.com/wxyhgk/retain-pdf.git

      - name: Translate code comments and strings
        run: |
          cd repo-translator
          echo "⚠️ comments-and-strings mode — translates UI labels and error messages."
          echo "   Strings used at runtime WILL be changed. Review before merging."
          repo-translator translate \
            --repo ../retain-pdf \
            --source-lang zh \
            --target-lang en \
            --translator libre,libre \
            --base-url http://localhost:5000,http://localhost:5001 \
            --output-dir ../retain-pdf-en \
            --translate-code \
            --code-scope comments-and-strings \
            --include 'backend/**/*.py' \
            --include 'backend/**/*.rs' \
            --include 'frontend/**/*.ts' \
            --include 'frontend/**/*.tsx' \
            --include 'frontend/**/*.mjs' \
            --include 'frontend/**/*.md' \
            --include 'frontend-react/**/*.ts' \
            --include 'frontend-react/**/*.tsx' \
            --include 'doc/**/*.md' \
            --include '*README.md' \
            --include 'CONTRIBUTING.md' \
            --exclude '**/fixtures/**' \
            --workers 8 \
            --batch-size 40

      - name: Upload translated code
        uses: actions/upload-artifact@v4
        with:
          name: retain-pdf-en
          path: retain-pdf-en/