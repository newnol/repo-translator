[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-translator"
version = "0.1.0"
description = "Translate entire GitHub repositories cheaply"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "langdetect>=1.0",
    "deep-translator>=1.11",
    "googletrans==4.0.0-rc1",
    "requests>=2.28",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black==25.11.0", "ruff"]

[project.scripts]
repo-translator = "repo_translator.cli:main"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100